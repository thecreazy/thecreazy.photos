<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riccardo Canella — fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Nanum+Pen+Script&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a17;--dim:#837a6f;--paper:#f4efe6;--red:#c4162a;--light:#efe7da;--mute:rgba(239,231,218,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0908;overflow:hidden;color:var(--light);font:13px/1.45 'IBM Plex Mono',ui-monospace,monospace}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
#fade{position:fixed;inset:0;z-index:4;background:#0b0908;opacity:0;pointer-events:none;transition:opacity .25s}
#fade.on{opacity:1}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,3%)}}

#brand{position:fixed;top:22px;left:26px;z-index:3;font:400 24px/1 'Instrument Serif',serif;cursor:pointer}
#brand small{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:7px}
#nav{position:fixed;top:24px;right:26px;z-index:3;display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font:11.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
#nav a{color:var(--mute);cursor:pointer;text-decoration:none;padding-bottom:3px;border-bottom:1.5px solid transparent;transition:color .25s,border-color .3s}
#nav a:hover{color:var(--light)}
#nav a.on{color:var(--light);border-color:var(--red)}

#title{position:fixed;left:0;right:0;z-index:2;text-align:center;pointer-events:none;transition:opacity .22s,transform .22s}
#title.out{opacity:0;transform:translateY(6px)}
#tSec{font:11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
#tName{font:400 clamp(40px,6.4vw,92px)/.95 'Instrument Serif',serif;margin:0;letter-spacing:-.01em}
#tName em{color:#a89e91}
#meta{position:fixed;left:0;right:0;z-index:2;text-align:center;pointer-events:none;font-size:11.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
#meta b{color:var(--light);font-weight:500}
#meta .sel{color:#ff6b5a}
#timeline{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:3;width:min(620px,84vw);height:18px;display:flex;gap:3px;align-items:center;cursor:pointer}
#timeline i{display:block;height:4px;border-radius:2px;background:rgba(239,231,218,.18);transition:background .3s,height .3s}
#timeline i.sec{margin-left:9px}
#timeline i.on{background:rgba(239,231,218,.75);height:6px}
#timeline i:hover{background:rgba(239,231,218,.45)}
#tlMark{position:absolute;top:0;width:1.5px;height:18px;background:var(--red);pointer-events:none;transition:left .12s linear}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;color:rgba(239,231,218,.38);font-size:11px;white-space:nowrap;pointer-events:none}
#tools{position:fixed;z-index:3;bottom:16px;right:18px;display:flex;gap:8px}
button.pill{font:inherit;font-size:11px;color:var(--mute);background:transparent;border:1px solid rgba(239,231,218,.16);border-radius:999px;padding:6px 12px;cursor:pointer}
button.pill:hover{color:var(--light);border-color:var(--red)}
#drop{position:fixed;inset:16px;z-index:8;border:2px dashed var(--red);border-radius:18px;display:none;place-items:center;text-align:center;background:rgba(11,9,8,.88);font:400 44px 'Covered By Your Grace',cursive;pointer-events:none}
#drop.on{display:grid}
#drop small{display:block;font:12.5px/1.7 'IBM Plex Mono',monospace;color:#a59c90;margin-top:10px}
#loader{position:fixed;inset:0;z-index:9;background:#0b0908;display:grid;place-content:center;gap:16px;text-align:center;transition:opacity .8s}
#loader div:first-child{font:italic 400 30px 'Instrument Serif',serif}
#loader.done{opacity:0;pointer-events:none}
#bar{width:220px;height:1px;background:#2b2622;margin:auto}
#bar i{display:block;height:100%;width:0;background:var(--red);transition:width .15s}

/* camera oscura */
#darkroom{position:fixed;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}
#darkroom.on{opacity:1;pointer-events:auto;cursor:pointer}
#drgl{position:absolute;inset:0;width:100%;height:100%;display:block}
#dial{position:absolute;right:28px;bottom:26px;width:92px;height:92px;opacity:.9;transition:opacity .4s}
#drCap{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#ff8a70;font:italic 400 18px 'Instrument Serif',serif;opacity:.55;white-space:nowrap;transition:opacity .3s}
#darkroom.lit #drCap,#darkroom.lit #dial{opacity:0}

/* pagine */
#page{position:fixed;inset:0;z-index:6;overflow-y:auto;background:var(--paper);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .6s}
#page.on{opacity:1;pointer-events:auto}
.pg{max-width:1160px;margin:0 auto;padding:0 32px 120px}
.pg-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 0 22px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:linear-gradient(var(--paper) 72%,rgba(244,239,230,0))}
.pg-top a{color:var(--ink);text-decoration:none;cursor:pointer}
.pg-top a:hover{color:var(--red)}
.pg h1{font:400 clamp(60px,10vw,150px)/.88 'Instrument Serif',serif;margin:40px 0 0;letter-spacing:-.015em}
.pg h1 em{display:block;font-style:italic;color:#7a7065}
.pg .meta{display:flex;flex-wrap:wrap;gap:10px 44px;margin:30px 0 40px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.pg .meta b{display:block;font-weight:500;color:var(--ink);font-size:12.5px;letter-spacing:.04em;margin-top:2px}
.pg .hero>*{display:block;width:100%;height:auto}
.pg figcaption{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.04em}
.pg figure{margin:0}
.pg .lede{font:400 clamp(24px,2.6vw,34px)/1.28 'Instrument Serif',serif;max-width:28ch;margin:70px 0 70px auto}
.pg .lede small{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--dim);margin-top:14px;letter-spacing:.04em}
.pg .sel{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pg .sel figure:nth-child(3n){grid-column:1/-1}
.pg .sel>figure>*:first-child{display:block;width:100%;height:auto}
.pg h3{font:italic 400 34px 'Instrument Serif',serif;margin:110px 0 22px}
.pg .sheet>*{display:block;width:100%;height:auto;box-shadow:0 24px 60px rgba(60,40,20,.2)}
.pg .next{display:flex;justify-content:space-between;gap:20px;margin-top:100px;padding-top:26px;border-top:1px solid #ddd3c4;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pg .next a{display:block;color:var(--ink);text-decoration:none;cursor:pointer;font:400 32px 'Instrument Serif',serif;text-transform:none;letter-spacing:0;margin-top:6px}
.pg .next a:hover{color:var(--red)}
.pg h3 small{font:11px 'IBM Plex Mono',monospace;color:var(--dim);font-style:normal;margin-left:8px}
.pg .arch a{display:flex;justify-content:space-between;gap:20px;align-items:baseline;padding:12px 0;border-bottom:1px solid #e2d9cb;color:var(--ink);text-decoration:none;cursor:pointer}
.pg .arch a:hover{color:var(--red)}
.pg .arch .n{font:400 clamp(22px,2.4vw,30px)/1.1 'Instrument Serif',serif}
.pg .arch .n em{color:#7a7065}
.pg .arch .n b{font:500 10px 'IBM Plex Mono',monospace;color:var(--red);vertical-align:middle;margin-left:6px}
.pg .arch .d{font-size:11px;color:var(--dim);white-space:nowrap;letter-spacing:.06em}
.pg .contact{font:400 clamp(28px,3.4vw,46px)/1.35 'Instrument Serif',serif;margin-top:50px}
.pg .contact span{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:28px}
/* ── pagina progetto: comune ── */
#page.st-busta{color:#e9e1d3;background:#141211}
.b-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 70% at 50% 46%,#3b3632 0%,#2a2623 38%,#1a1816 70%,#100f0e 100%)}
.b-bg::after{content:'';position:absolute;inset:0;background:var(--t-grain);opacity:.07;mix-blend-mode:overlay}
#page.st-busta>section,#page.st-busta>.pt{position:relative}
.pt{position:sticky;top:0;z-index:20;transition:opacity .4s;background:linear-gradient(rgba(20,18,17,.85) 55%,rgba(20,18,17,0));display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7d7368}
.pt a{color:inherit;cursor:pointer;text-decoration:none}
.pt a:hover,.pt a.on{color:var(--red)}
.pt .sw{letter-spacing:.06em}
#page.st-busta .pt a[data-back]{color:#efe7da}
@property --rx{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --ry{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --s{syntax:'<number>';inherits:false;initial-value:1}
@property --in{syntax:'<number>';inherits:false;initial-value:1}
@property --sh{syntax:'<number>';inherits:false;initial-value:0}
.print{margin:0;background:var(--t-paper) #f4f1ea;background-size:500px;padding:1.4%;box-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.6),0 40px 80px -30px rgba(0,0,0,.7);transform:rotate(var(--rot,0deg));cursor:zoom-in;position:relative}
.print>img,.print>canvas{display:block;width:100%;height:auto}
.print::after{content:'';position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.14),rgba(255,255,255,0) 35%,rgba(0,0,0,.04));pointer-events:none}
.b-prints .print{--py:0px;opacity:var(--in);transform:translateY(calc(var(--py) + (1 - var(--in)) * -46px)) perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry)) rotate(calc(var(--rot) + (1 - var(--in)) * 5deg)) scale(calc(var(--s) + (1 - var(--in)) * .07));
  transition:--rx .5s cubic-bezier(.2,.7,.2,1),--ry .5s cubic-bezier(.2,.7,.2,1),--s .5s cubic-bezier(.2,.7,.2,1),--in 1.1s cubic-bezier(.2,.75,.25,1),--sh .4s,box-shadow .5s;will-change:transform}
.b-prints .print.drop{--in:0;box-shadow:0 40px 90px -20px rgba(0,0,0,.5)}
.b-prints .print.lift{--s:1.025;box-shadow:calc(var(--ox,0) * 1px) calc(26px + var(--oy,0) * 1px) 60px -12px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.4);--sh:1}
.b-prints .print::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--sh);mix-blend-mode:screen;background:radial-gradient(ellipse 55% 45% at var(--gx,50%) var(--gy,30%),rgba(255,250,240,.28),rgba(255,250,240,.06) 45%,rgba(255,255,255,0) 70%)}
#lb{position:fixed;inset:0;z-index:30;background:rgba(14,12,11,.94);display:grid;place-items:center;padding:4vh 4vw;opacity:0;pointer-events:none;transition:opacity .35s;cursor:zoom-out}
#lb.on{opacity:1;pointer-events:auto}
#lb>*{max-width:100%;max-height:92vh;width:auto;height:auto;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tape{position:absolute;width:calc(var(--pu,6px)*16);height:calc(var(--pu,6px)*4.6);background:rgba(232,221,192,.82);box-shadow:0 1px 1px rgba(0,0,0,.08);clip-path:polygon(3% 0,97% 4%,100% 22%,97% 40%,100% 62%,96% 100%,2% 96%,0 78%,3% 55%,0 30%);mix-blend-mode:multiply;z-index:2}

/* ── busta ── */
.b-hero{position:relative}
.b-stage{position:sticky;top:0;height:100vh;overflow:hidden;perspective:1600px}
.env{position:absolute;left:50%;top:50%;margin:0;translate:-50% -50%;perspective:1400px}
.env-back,.env-front{position:absolute;inset:0;border-radius:4px}
.env-back{background:var(--t-kraft) #a8845a;background-size:600px;filter:brightness(.72);box-shadow:0 50px 90px -30px rgba(0,0,0,.75),0 10px 24px -8px rgba(0,0,0,.5)}
.env-front{background:var(--t-kraft) #b58f63;background-size:600px;z-index:3;padding:calc(var(--u)*12) calc(var(--u)*7) calc(var(--u)*6);color:#8e2b20;font-family:'IBM Plex Mono',monospace;font-size:calc(var(--u)*2.6);letter-spacing:.08em}
.env-front::before{content:'';position:absolute;left:0;right:0;top:0;height:calc(var(--u)*1.4);background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0))}
.env .print.hero{position:absolute;z-index:2;transform-origin:50% 50%;will-change:transform}
.env .print.hero.out{z-index:5}
.env-flap{position:absolute;left:0;right:0;top:0;height:28%;transform-origin:50% 0;transform-style:preserve-3d;z-index:4}
.env-flap.open{z-index:1}
.env-flap>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px 4px calc(var(--u)*6) calc(var(--u)*6)}
.env-flap .fo{background:var(--t-kraft) #b58f63;background-size:600px;filter:brightness(1.03);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.2) rgba(40,20,5,.35)}
.env-flap .fi{background:var(--t-kraft) #a8845a;background-size:600px;filter:brightness(.8);transform:rotateX(180deg)}
.f-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #8e2b20;padding-bottom:calc(var(--u)*1);font-weight:500}
.f-head b{font-size:1.6em}
.f-sub{font-size:.82em;opacity:.85;margin:calc(var(--u)*.8) 0 calc(var(--u)*4)}
.f-no{font-size:1.15em;margin-bottom:calc(var(--u)*3)}
.env-front i{font-family:'Nanum Pen Script',cursive;font-style:normal;color:#1d2a4a;font-size:2.2em;letter-spacing:0;line-height:1;text-transform:none}
.f-row{display:flex;align-items:baseline;gap:calc(var(--u)*2);border-bottom:1px solid rgba(142,43,32,.6);padding:calc(var(--u)*1.6) 0 calc(var(--u)*.4);min-height:calc(var(--u)*6.5)}
.f-row span{text-transform:uppercase;font-size:.85em;flex:none}
.f-row.two i{flex:1}
.f-checks{display:flex;gap:calc(var(--u)*3.4);margin:calc(var(--u)*3) 0 calc(var(--u)*1);font-size:.9em}
.f-checks label{display:flex;align-items:center;gap:calc(var(--u)*1)}
.f-checks b{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border:1.2px solid #8e2b20;display:grid;place-items:center;font:400 calc(var(--u)*5)/1 'Nanum Pen Script',cursive;color:#1d2a4a}
.stamp{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*9);transform:rotate(-11deg);border:calc(var(--u)*.7) double rgba(120,40,110,.72);color:rgba(120,40,110,.72);padding:calc(var(--u)*1) calc(var(--u)*2.6);font:500 calc(var(--u)*4.4) 'IBM Plex Mono',monospace;letter-spacing:.14em;mix-blend-mode:multiply;-webkit-mask-image:var(--t-paper);mask-image:var(--t-paper);mask-size:220px}
.b-hint{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);font:400 30px 'Nanum Pen Script',cursive;color:#a89d8f;opacity:0;transition:opacity .4s}
.b-label{display:flex;align-items:baseline;gap:16px;margin:0 0 26px}
.b-label span{font:400 44px/1 'Covered By Your Grace',cursive;color:#ece4d6}
.b-label small{font-size:11px;letter-spacing:.08em;color:#8a8074;text-transform:uppercase}
.b-neg,.b-prints{scroll-margin-top:70px}
.b-neg{max-width:1100px;margin:6vh auto 0;padding:0 24px}
.sleeve{position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(255,246,225,.22),0 0 220px rgba(255,236,200,.14);background:#f3f1ea;min-height:200px}
.sleeve canvas{display:block;width:100%;height:auto}
.sleeve canvas+canvas{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.sleeve:hover canvas+canvas{opacity:1}
.b-prints{max-width:1180px;margin:16vh auto 0;padding:0 24px}
.b-prints .row{display:flex;justify-content:center;align-items:flex-start;gap:5%;margin:0 0 14vh}
.b-prints .row.big .print{width:68%}
.b-prints .row.big .print.port{width:44%}
.b-prints .row.pair .print{width:42%}
.b-prints .row.pair .print.port{width:31%}
.b-prints .row.pair .print:nth-child(2){margin-top:9vh}
.b-prints .row.side{justify-content:flex-end;align-items:center;padding-right:6%}
.b-prints .row.side .print{width:40%}
.b-prints .row.side .print.port{width:28%}
.b-prints .margin{font:400 38px 'Nanum Pen Script',cursive;color:#bdb2a3;margin-right:4%}
.b-prints .margin i{font-style:normal;margin-left:10px}
.b-end{position:relative;height:92vh;overflow:hidden;margin-top:8vh}
.b-prev{position:absolute;left:24px;top:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a8074;cursor:pointer;text-decoration:none;transition:opacity .4s}
.b-prev:hover{color:#efe7da}
.b-nextlab{position:absolute;left:50%;top:16vh;transform:translateX(-50%);font:400 34px 'Nanum Pen Script',cursive;color:#a89d8f;transition:opacity .4s}
.next-env{position:absolute;left:50%;top:30vh;transform:translateX(-50%) rotate(-1.5deg);cursor:pointer;transition:transform .5s cubic-bezier(.3,.1,.2,1)}
.next-env:hover{transform:translateX(-50%) translateY(-5vh) rotate(-.5deg)}
.next-env.go{transition:transform .7s cubic-bezier(.5,0,.2,1);z-index:30}
.next-env .env-back,.next-env .env-front{position:absolute;inset:0;border-radius:4px}
.next-env .env-flap{z-index:4}
@media (max-width:760px){.b-prints .row{flex-direction:column;align-items:center;gap:6vh}.b-prints .row .print,.b-prints .row .print.port{width:86%!important;margin-top:0!important}.b-prints .margin{display:none}.b-label span{font-size:34px}}

@media (max-width:760px){#hint{display:none}#nav{top:62px;left:26px;right:auto;justify-content:flex-start;gap:12px}.pg{padding:0 16px 80px}.pg .sel{grid-template-columns:1fr}#tools{display:none}#timeline{bottom:30px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="fade"></div>
<header id="brand">Riccardo Canella<small>fotografia · 2021—2025</small></header>
<nav id="nav"></nav>
<div id="title"><div id="tSec"></div><h1 id="tName"></h1></div>
<div id="meta"></div>
<div id="timeline"><span id="tlMark"></span></div>
<div id="hint">scorri o trascina · ← → un fotogramma · clic sul fotogramma nella luce per svilupparlo</div>
<div id="tools"><button class="pill" id="bFolder">carica cartella</button><button class="pill" id="bFiles">carica foto</button></div>
<input type="file" id="inFolder" webkitdirectory multiple hidden>
<input type="file" id="inFiles" accept="image/*" multiple hidden>
<div id="drop">lascia qui le foto<small>Sezione / Nome - Titolo / foto.jpg<br>sezioni: models · projects · travels · erotics</small></div>
<div id="loader"><div>carico il rullino…</div><div id="bar"><i></i></div></div>
<div id="darkroom">
  <canvas id="drgl"></canvas>
  <svg id="dial" viewBox="0 0 100 100"></svg>
  <div id="drCap">sviluppo · clic per saltare</div>
</div>
<div id="page"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

/* ═════════ costanti (mm) ═════════ */
const TAU = Math.PI * 2, lerp = (a, b, t) => a + (b - a) * t, clamp = THREE.MathUtils.clamp;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const MM = 7, MA = 3;
const STRIP_H = 35, PITCH = 38, FW = 36, FH = 24, MAXF = 12;
const PAPER_W = 254, STRIP_W = 232, MARGIN_X = 11, TOP = 28, BOTTOM = 14, SGAP = 4.5;
const RED = '#c4162a', WAX = '#f1e4b3', INK = '#1b1917';
const MARK = 'Covered By Your Grace', PEN = 'Nanum Pen Script';
const ZONES = [{ id: 'models', label: 'Models' }, { id: 'projects', label: 'Projects' }, { id: 'travels', label: 'Travels' }, { id: 'erotic', label: 'Erotics', locked: true }];
const DEMO = [
